[settings]
python.uv_venv_auto = true

[tools]
python = "3.12"
uv = "latest"
jq = "latest"
go = "1.26"
"github:irskep/localci" = "0.2.3"
"pipx:zensical" = { version = "0.0.43", uvx_args = "--with mkdocs-github-admonitions-plugin" }

[env]
_.python.venv = { path = ".venv" }
_.file = ".env"

[tasks]
install = "uv sync"
test = "uv run pytest"
lint = "uv run ruff check"
format = "uv run ruff format"
"format:check" = "uv run ruff format --check"
claude-hook-lint = "./scripts/claude-hook-lint.sh"
sync-readme = "uv run python scripts/sync_readme.py"
"docs:install" = "uv sync --group docs --group dev && mise install pipx:zensical"
"docs:prep" = "cp CHANGELOG.md docs/CHANGELOG.md"

"go:build" = "go build -o autowt . && go build -o awt ./cmd/awt"
"go:vet" = "go vet ./..."
"go:run" = "go run ."
"go:test" = "go test ./..."

[tasks."localci:setup"]
description = "Install dependencies for LocalCI runs"
run = [
  "mise install",
  "uv sync --group docs --group dev",
  "mise install pipx:zensical",
]

[tasks."localci:python-test"]
description = "Run Python tests"
run = "uv run pytest"

[tasks."localci:go-test"]
description = "Run Go tests"
run = "go test ./..."

[tasks."localci:docs-build"]
description = "Build documentation"
run = '''
mise run docs:build
if [ -n "${LOCALCI_TASK_OUTPUT_DIR:-}" ]; then
  mkdir -p "$LOCALCI_TASK_OUTPUT_DIR/site"
  cp -R site/. "$LOCALCI_TASK_OUTPUT_DIR/site/"
fi
'''

[tasks."docs:serve"]
run = "zensical serve"
depends = ["docs:install", "docs:prep"]

[tasks."docs:build"]
run = "zensical build"
depends = ["docs:install", "docs:prep"]
